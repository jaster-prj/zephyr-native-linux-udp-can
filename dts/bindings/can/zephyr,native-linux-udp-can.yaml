description: Zephyr CAN driver using a UDP gateway

compatible: "zephyr,native-linux-udp-can"

include: can-fd-controller.yaml

properties:
  host:
    type: string
    required: true
    description: |
      Hostname or IPv4 address of the UDP CAN gateway.

  port:
    type: int
    required: true
    description: |
      UDP port used by the gateway.

  local-port:
    type: int
    required: false
    default: 0
    description: |
      Local UDP port to bind for receiving traffic. 0 selects an ephemeral port.
